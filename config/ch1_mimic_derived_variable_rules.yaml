pf_ratio:
  status: frozen_shared_primary_derived_only
  insertion_point: mimic_blocks_after_preferred_source_block_aggregation
  formula: pf_ratio = pao2 / (fio2_percent / 100)
  support_variables:
    - pao2
    - fio2
  unit_conversions:
    fio2: percent_to_fraction_by_dividing_by_100
  missing_support_rule: leave_missing

vt_per_kg_ibw:
  status: frozen_shared_primary_derived_only
  insertion_point: mimic_blocks_after_preferred_source_block_aggregation
  formula: vt_per_kg_ibw = vt_mL / IBW_kg
  support_variables:
    - vt
    - height
    - gender
  height_itemids:
    cm: 226730
    inch: 226707
  height_conversion:
    inch_to_cm: height_cm = height_in * 2.54
  height_plausibility_cm:
    min: 100
    max: 250
  height_collapse: stay_level_median_after_unit_conversion
  ibw_formula: Devine
  ibw_formula_detail:
    male: IBW_kg = 50.0 + 2.3 * (height_in - 60)
    female: IBW_kg = 45.5 + 2.3 * (height_in - 60)
  missing_support_rule: leave_missing
  actual_weight_substitution: prohibited
